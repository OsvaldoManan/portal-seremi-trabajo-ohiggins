name: Refresh data (manual + weekly)

on:
  workflow_dispatch:
  schedule:
    # Lunes 06:00 UTC = Lunes 02:00/03:00 hora Chile
    - cron: '0 6 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas openpyxl xlrd pdfplumber

      - name: Re-procesar datos
        run: python process_data.py

      - name: Commit cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain site/data/)" ]]; then
            git add site/data/
            git commit -m "data: refresco automatico semanal $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en los JSON regenerados."
          fi
